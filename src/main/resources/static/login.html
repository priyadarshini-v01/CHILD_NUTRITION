<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Nurture</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <a class="brand auth-brand" href="/login.html"><span class="brand-mark">✿</span><span>Nurture<small>CHILD NUTRITION</small></span></a>
    <section class="auth-card">
      <div class="eyebrow">WELCOME BACK</div><h1>Good to see you.</h1><p class="muted">Sign in to continue caring for your little one.</p>
      <div id="auth-alert" class="alert d-none" role="alert"></div>
      <form id="login-form" class="vstack gap-3">
        <label class="form-label">Email address<input class="form-control" type="email" name="email" autocomplete="email" required></label>
        <label class="form-label">Password<input class="form-control" type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary btn-lg mt-2" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">New to Nurture? <a href="/register.html">Create an account</a></p>
    </section>
    <p class="auth-foot">Small steps today. Healthy futures tomorrow.</p>
  </main>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body>
</html>
