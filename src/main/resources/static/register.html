<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Nurture</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <a class="brand auth-brand" href="/login.html"><span class="brand-mark">✿</span><span>Nurture<small>CHILD NUTRITION</small></span></a>
    <section class="auth-card">
      <div class="eyebrow">YOUR FAMILY’S HEALTH, IN ONE PLACE</div><h1>Let’s get started.</h1><p class="muted">Create your parent account to track growth and nutrition.</p>
      <div id="auth-alert" class="alert d-none" role="alert"></div>
      <form id="register-form" class="vstack gap-3">
        <label class="form-label">Your name<input class="form-control" name="name" autocomplete="name" maxlength="120" required></label>
        <label class="form-label">Email address<input class="form-control" type="email" name="email" autocomplete="email" maxlength="190" required></label>
        <label class="form-label">Password <span class="muted fw-normal">(at least 8 characters)</span><input class="form-control" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
        <button class="btn btn-primary btn-lg mt-2" type="submit">Create account <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
    </section>
    <p class="auth-foot">Small steps today. Healthy futures tomorrow.</p>
  </main>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body>
</html>
