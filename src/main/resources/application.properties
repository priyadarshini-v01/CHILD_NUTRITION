spring.application.name=child-nutrition

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/child_nutrition_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Optional broad nutrition Q&A. No provider is called unless explicitly selected and keyed.
nutrition.assistant.provider=${NUTRITION_AI_PROVIDER:}
nutrition.assistant.model=${NUTRITION_AI_MODEL:gpt-4.1-mini}
nutrition.assistant.web-search=${NUTRITION_AI_WEB_SEARCH:false}
nutrition.assistant.timeout-seconds=${NUTRITION_AI_TIMEOUT_SECONDS:20}
nutrition.assistant.rate-limit-per-minute=${NUTRITION_AI_RATE_LIMIT_PER_MINUTE:20}

# Set JWT_SECRET to a base64-encoded key of at least 256 bits before starting the application.
jwt.secret=${JWT_SECRET:}
nutrition.alert.low-threshold=0.8
nutrition.alert.high-threshold=1.2
nutrition.alert.sugar-max-grams=${NUTRITION_SUGAR_MAX_GRAMS:50}
nutrition.alert.sodium-max-mg=${NUTRITION_SODIUM_MAX_MG:2000}
nutrition.alert.saturated-fat-max-grams=${NUTRITION_SATURATED_FAT_MAX_GRAMS:20}
# Broad input guardrails; age-specific checks are applied by the growth API.
growth.validation.min-height-cm=${GROWTH_MIN_HEIGHT_CM:30}
growth.validation.max-height-cm=${GROWTH_MAX_HEIGHT_CM:250}
growth.validation.min-weight-kg=${GROWTH_MIN_WEIGHT_KG:0.5}
growth.validation.max-weight-kg=${GROWTH_MAX_WEIGHT_KG:300}
growth.validation.same-day-height-tolerance-cm=${GROWTH_SAME_DAY_HEIGHT_TOLERANCE_CM:1.0}
growth.validation.same-day-weight-tolerance-kg=${GROWTH_SAME_DAY_WEIGHT_TOLERANCE_KG:0.5}
growth.validation.height-rate-under-2-cm-year=${GROWTH_HEIGHT_RATE_UNDER_2:30}
growth.validation.height-rate-2-to-6-cm-year=${GROWTH_HEIGHT_RATE_2_TO_6:15}
growth.validation.height-rate-6-to-12-cm-year=${GROWTH_HEIGHT_RATE_6_TO_12:10}
growth.validation.height-rate-12-to-18-cm-year=${GROWTH_HEIGHT_RATE_12_TO_18:15}
growth.validation.weight-rate-under-2-kg-year=${GROWTH_WEIGHT_RATE_UNDER_2:8}
growth.validation.weight-rate-2-to-6-kg-year=${GROWTH_WEIGHT_RATE_2_TO_6:5}
growth.validation.weight-rate-6-to-12-kg-year=${GROWTH_WEIGHT_RATE_6_TO_12:10}
growth.validation.weight-rate-12-to-18-kg-year=${GROWTH_WEIGHT_RATE_12_TO_18:15}
